version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omnilog-postgres
    restart: always
    environment:
      POSTGRES_USER: omnilog
      POSTGRES_PASSWORD: omnilog_secure_pass
      POSTGRES_DB: omnilog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilog -d omnilog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnilog-backend
    restart: always
    ports:
      - "5000:5000"
      - "514:5140/udp"
      - "514:5140/tcp"
      - "6514:6514/tcp"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://omnilog:omnilog_secure_pass@postgres:5432/omnilog_db?schema=public
      JWT_SECRET: omnilog_super_secret_jwt_key_32_chars_min!
      REFRESH_TOKEN_SECRET: omnilog_super_secret_refresh_token_key!
      SYSLOG_UDP_PORT: 5140
      SYSLOG_TCP_PORT: 5140
      SYSLOG_TLS_PORT: 6514
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnilog-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
